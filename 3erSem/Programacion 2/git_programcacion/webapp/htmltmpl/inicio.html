<h2 class="p-3 text-3xl text-center">
	Mi aplicación
</h2>

<main class="flex flex-col items-center justify-start grow w-full max-w-5xl gap-4 p-2 mx-auto">
	{{ if .Nombre }}
		<p class="text-lg">
			Hola, {{ .Nombre }}!
		</p>
	{{ else }}
		<p class="text-lg">
			Hola mundo!
		</p>
	{{ end }}

	<div class="p-4">
		<button
			type="button"
			hx-get="/trigger-404"
			class="p-2 text-white bg-cyan-900 rounded-md hover:bg-cyan-800">
			Trigger error
		</button>

	</div>
</main>

<footer class="flex flex-wrap justify-between gap-4 p-4">
	<a href="/logout" class="transition-colors hover:text-cyan-400">
		Logout
		<i class="px-1 text-sm fa-solid fa-fish-fins"></i>
	</a>
</footer>
